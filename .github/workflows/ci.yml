name: Pinned iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: DelveKit and DelveStore (Linux swift test)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Swift version
        run: swift --version
      - name: Install SQLite development headers (GRDB)
        # GRDB 7 links SQLite through a C systemLibrary target; the stock
        # swift image ships the runtime lib but not the dev headers.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-dev
      - name: Run DelveKit package tests
        run: swift test --package-path Packages/DelveKit
      - name: Run DelveStore package tests
        run: swift test --package-path Packages/DelveStore
      - name: DelveKit purity gate (no UIKit/SpriteKit/GRDB)
        run: bash scripts/check_delvekit_purity.sh
      - name: Zero-network gate
        run: bash scripts/check_zero_network.sh
      - name: Native-only framework gate
        run: bash scripts/check_native_only.sh
      - name: Gitignore keeps signing material out
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in fake.p8 fake.p12 fake.mobileprovision fake.cer; do
            touch "$f"
            git check-ignore -q "$f" || { echo "FAIL: $f is not gitignored"; exit 1; }
            rm "$f"
          done
          echo "Signing-material gitignore check: PASS"

  ios:
    name: macos-26 simulator lane (toolchain pin + iPhone-only + UI tests)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select exact pinned toolchain (blocker if absent)
        run: |
          set -euo pipefail
          # toolchain.json pin: Xcode 26.0.1 / 17A400 / iOS SDK 26.0.
          # A missing exact pin is an ENVIRONMENT ACCEPTANCE BLOCKER —
          # never silently substitute another Xcode.
          REQUIRED_VERSION="Xcode 26.0.1"
          REQUIRED_BUILD="17A400"
          found=""
          for app in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.1_*.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            dev="$app/Contents/Developer"
            ver=$(DEVELOPER_DIR="$dev" xcodebuild -version 2>/dev/null | tr -d '\r') || continue
            vline=$(echo "$ver" | head -1)
            bline=$(echo "$ver" | grep -i "build version" | awk '{print $3}')
            if [ "$vline" = "$REQUIRED_VERSION" ] && [ "$bline" = "$REQUIRED_BUILD" ]; then
              found="$dev"
              echo "Exact pin found: $app ($vline, build $bline)"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::ACCEPTANCE BLOCKER: required toolchain $REQUIRED_VERSION ($REQUIRED_BUILD) not present on this runner. Enumerated candidates:"
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              echo "$app -> $(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | tr -d '\r' | head -1)"
            done
            exit 1
          fi
          # Make the pinned toolchain the default for every later step.
          sudo xcode-select -s "$found"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "$sdk" != "26.0" ]; then
            echo "::error::ACCEPTANCE BLOCKER: pinned toolchain reports iPhoneOS SDK $sdk, expected 26.0"
            exit 1
          fi
          echo "iPhoneOS SDK $sdk: PASS"

      - name: Ensure iOS simulator platform runtime
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # The macos-26 runner image no longer pre-installs the iOS 26.0
          # simulator runtime for Xcode 26.0.1 (see actions/runner-images#13570
          # mitigation). The image DOES carry newer runtimes (iOS 26.2/26.4/26.5),
          # but the pinned Xcode 26.0.1 can only use a runtime of its own
          # SDK version. This step installs the pinned Xcode's OWN platform
          # component — it is NOT a toolchain substitution: the exact Xcode
          # 26.0.1 (17A400) pin selected above remains in force.
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SDK_VER" | cut -d. -f1,2 | tr '.' '-')"
          echo "Pinned iphonesimulator SDK: $SDK_VER — required runtime id: $RUNTIME_ID"
          if xcrun simctl list runtimes 2>/dev/null | grep -q "$RUNTIME_ID"; then
            echo "Required runtime already present:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          else
            echo "Required runtime missing — downloading platform for the pinned Xcode (this can take several minutes)..."
            xcrun simctl list > /dev/null 2>&1 || true   # warm the simulator service
            xcodebuild -downloadPlatform iOS -architectureVariant universal || true
            if ! xcrun simctl list runtimes | grep -q "$RUNTIME_ID"; then
              echo "::error::ACCEPTANCE BLOCKER: iOS $SDK_VER simulator runtime could not be installed on this runner (Apple may no longer serve this platform build). Available runtimes:"
              xcrun simctl list runtimes || true
              exit 1
            fi
            echo "Runtime installed:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          fi

      - name: Ensure iPhone simulator device on the pinned runtime
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The macos-26 image ships pre-created devices only for the runtimes
          # it pre-installed (26.2+). After the exact SDK-matched runtime is
          # present, deterministically create one iPhone on it if none exists,
          # so the pinned-26.0 simulator lane has a concrete bootable device
          # for Scripts/ci.sh (which uses a specific-UDID destination).
          # Candidates are tried newest-name-first until one accepts creation
          # (bounded by the finite devicetype list).
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SDK_VER" | cut -d. -f1,2 | tr '.' '-')"
          existing=$(xcrun simctl list devices --json | python3 -c '
          import json, sys
          runtime = sys.argv[1]
          payload = json.load(sys.stdin)
          udid = next((d["udid"] for d in payload.get("devices", {}).get(runtime, [])
                       if d.get("isAvailable") and str(d.get("name", "")).startswith("iPhone")), "")
          print(udid)' "$RUNTIME_ID")
          if [ -n "$existing" ]; then
            echo "iPhone device already present on $RUNTIME_ID: $existing"
          else
            mapfile -t CANDIDATES < <(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          names = sorted(
              (t["name"] for family in payload.get("devicetypes", {}).values()
               for t in family if t["name"].startswith("iPhone")),
              reverse=True)
          print("\n".join(names))')
            if [ "${#CANDIDATES[@]}" -eq 0 ]; then
              echo "::error::ACCEPTANCE BLOCKER: no iPhone devicetypes available for $RUNTIME_ID"
              exit 1
            fi
            created=""
            for name in "${CANDIDATES[@]}"; do
              if created_udid=$(xcrun simctl create "iPhone (Delve CI)" "$name" "$RUNTIME_ID" 2>/dev/null); then
                created="$created_udid"
                echo "Created 'iPhone (Delve CI)' ($name) on $RUNTIME_ID: $created_udid"
                break
              fi
              echo "devicetype '$name' rejected on $RUNTIME_ID; trying next candidate"
            done
            if [ -z "$created" ]; then
              echo "::error::ACCEPTANCE BLOCKER: could not create any iPhone device on $RUNTIME_ID"
              exit 1
            fi
          fi

      - name: Run pinned simulator validation
        timeout-minutes: 45
        run: Scripts/ci.sh "$TARGET_SHA"

      - name: Upload results and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ci-${{ env.TARGET_SHA }}
          path: build/ci-artifacts
          if-no-files-found: warn
          retention-days: 14
